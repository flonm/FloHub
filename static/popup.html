<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FloHub inbox</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1f2328;
        --muted: #59636e;
        --bg: #ffffff;
        --bg-muted: #f6f8fa;
        --border: #d1d9e0;
        --accent: #0969da;
        --focus: #0969da;
        --success: #1a7f37;
        --success-bg: #dafbe1;
        --attention: #9a6700;
        --attention-bg: #fff8c5;
        --accent-bg: #ddf4ff;
        --danger: #d1242f;
        --danger-bg: #ffebe9;
        --done: #8250df;
        --done-bg: #fbefff;
        --neutral-bg: rgba(175, 184, 193, 0.2);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f0f6fc;
          --muted: #9198a1;
          --bg: #0d1117;
          --bg-muted: #151b23;
          --border: #3d444d;
          --accent: #4493f8;
          --focus: #1f6feb;
          --success: #3fb950;
          --success-bg: rgba(46, 160, 67, 0.15);
          --attention: #d29922;
          --attention-bg: rgba(187, 128, 9, 0.15);
          --accent-bg: rgba(56, 139, 253, 0.15);
          --danger: #f85149;
          --danger-bg: rgba(248, 81, 73, 0.1);
          --done: #ab7df8;
          --done-bg: rgba(171, 125, 248, 0.15);
          --neutral-bg: rgba(101, 108, 118, 0.2);
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 420px;
        max-height: 580px;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      }
      svg { flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      svg .fill { fill: currentColor; stroke: none; }
      button { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 6px; }

      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
      }
      h1 { margin: 0; font-size: 14px; }
      .updated { flex: 1; color: var(--muted); font-size: 12px; }
      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .icon-button:hover { background: var(--bg-muted); color: var(--fg); }
      .spinning svg { animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      main { padding: 4px 0 8px; }
      section { padding: 8px 0 4px; }
      h2 {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        padding: 0 12px 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }
      .count {
        min-width: 18px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--neutral-bg);
        color: var(--fg);
        font-size: 11px;
        text-align: center;
      }
      ul { margin: 0; padding: 0; list-style: none; }
      .group-label {
        display: flex;
        gap: 6px;
        padding: 6px 12px 2px;
        color: var(--muted);
        font-size: 11px;
      }
      .pull {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        column-gap: 8px;
        align-items: center;
        padding: 5px 12px;
        color: inherit;
        text-decoration: none;
      }
      .pull:hover { background: var(--bg-muted); }
      .pull:hover .title { color: var(--accent); }
      .state {
        display: inline-flex;
        align-items: center;
        justify-self: start;
        height: 20px;
        padding: 0 7px;
        border-radius: 999px;
        background: var(--tone-bg);
        color: var(--tone);
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }
      .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .number { color: var(--muted); }
      .meta {
        grid-column: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 2px 10px;
        color: var(--muted);
        font-size: 11px;
      }
      .tag { color: var(--attention); font-weight: 600; }
      [data-tone="success"] { --tone: var(--success); --tone-bg: var(--success-bg); }
      [data-tone="attention"] { --tone: var(--attention); --tone-bg: var(--attention-bg); }
      [data-tone="accent"] { --tone: var(--accent); --tone-bg: var(--accent-bg); }
      [data-tone="danger"] { --tone: var(--danger); --tone-bg: var(--danger-bg); }
      [data-tone="done"] { --tone: var(--done); --tone-bg: var(--done-bg); }
      [data-tone="neutral"] { --tone: var(--muted); --tone-bg: var(--neutral-bg); }

      .empty, .message { margin: 0; padding: 4px 12px 8px; color: var(--muted); }
      .notice { margin: 8px 12px 0; padding: 6px 10px; border-radius: 6px; background: var(--danger-bg); color: var(--danger); }
      .text-button {
        margin: 0 12px;
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-muted);
        cursor: pointer;
      }
      @media (prefers-reduced-motion: reduce) {
        .spinning svg { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="popup.js"></script>
  </body>
</html>
